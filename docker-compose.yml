services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: painel
      POSTGRES_PASSWORD: painel
      POSTGRES_DB: painel_gestor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painel -d painel_gestor"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplicação completa (API + front já compilado). Use: docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://painel:painel@db:5432/painel_gestor
      JWT_SECRET: troque-este-segredo-em-producao
      NODE_ENV: production
      PORT: 3000
      APP_URL: http://localhost:3000
      STORAGE: disco
      UPLOAD_DIR: /app/uploads
      # RESEND_API_KEY, S3_*, SENTRY_DSN: veja .env.example
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
